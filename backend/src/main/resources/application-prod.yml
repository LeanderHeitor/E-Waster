# Perfil de PRODUCAO (ativado com SPRING_PROFILES_ACTIVE=prod).
# Tudo aqui vem de variaveis de ambiente — nada de senha/segredo no codigo.
# No Render, os DB_* sao preenchidos automaticamente a partir do banco (render.yaml).
spring:

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    baseline-on-migrate: true

jwt:
  # OBRIGATORIO em producao. Gere um segredo longo e aleatorio.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:admin@ewaster.com}
    senha: ${ADMIN_SENHA:admin123}
  cors:
    # URL(s) do front separadas por virgula. Aceita curinga: https://*.onrender.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
