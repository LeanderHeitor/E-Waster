# Blueprint do Render — cria as 3 pecas de uma vez.
# No Render: New > Blueprint > aponte para este repositorio.
# Doc: https://render.com/docs/blueprint-spec

databases:
  - name: ewaster-db
    databaseName: ewaster
    user: ewaster
    plan: free
    region: oregon

services:
  # ---------- BACKEND (Spring Boot, via Docker) ----------
  - type: web
    name: ewaster-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Conexao com o banco: preenchido automaticamente pelo Render
      - key: DB_HOST
        fromDatabase:
          name: ewaster-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ewaster-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ewaster-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ewaster-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ewaster-db
          property: password
      # Segredo do JWT: o Render gera um valor aleatorio forte
      - key: JWT_SECRET
        generateValue: true
      # Senha do admin inicial: defina manualmente no painel (fica oculta)
      - key: ADMIN_SENHA
        sync: false
      # Libera o front (qualquer subdominio onrender.com). Pode restringir depois.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com

  # ---------- FRONTEND (Vite/React, site estatico) ----------
  - type: web
    name: ewaster-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # IMPORTANTE: deve bater com a URL real do backend (confira no painel apos o deploy).
      - key: VITE_API_URL
        value: https://ewaster-backend.onrender.com/api/v1
    routes:
      # SPA: qualquer rota cai no index.html (senao dar F5 numa rota da 404)
      - type: rewrite
        source: /*
        destination: /index.html
